name: dns-stack

x-dnsstack: &dnsstack
  build: .
  image: dns-stack:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - ./config:/app/config:ro
    - ./lists:/app/lists:ro

services:
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dns-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki

  collector:
    <<: *dnsstack
    command: ["collect"]
    volumes:
      - ./config:/app/config:ro
      - ./lists:/app/lists:ro
      - collector-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      loki:
        condition: service_healthy

  sync:
    <<: *dnsstack
    command: ["watch-sync", "--interval", "${SYNC_INTERVAL:-3600}"]

  linked-ip:
    <<: *dnsstack
    command: ["linked-ip", "--interval", "300"]

volumes:
  loki-data:
  grafana-data:
  collector-data:
